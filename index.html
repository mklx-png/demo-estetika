  <!DOCTYPE html>                                                                                                         <html lang="lt">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Estetika — Konsultacija</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Georgia', serif; background: #fdf6f0; color: #333; }
      .hero { background: #2c2c2c; color: white; text-align: center; padding: 60px 20px 40px; }
      .hero h1 { font-size: 2rem; letter-spacing: 2px; margin-bottom: 10px; }
      .hero p { color: #ccc; font-size: 1rem; }
      .form-section { max-width: 480px; margin: 50px auto; padding: 0 20px; }
      .form-section h2 { font-size: 1.3rem; margin-bottom: 8px; }
      .form-section p { color: #777; margin-bottom: 30px; font-size: 0.95rem; }
      label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #555; }
      input, select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px;
  font-size: 1rem; }
      button { width: 100%; padding: 14px; background: #c9a96e; color: white; border: none; border-radius: 6px;
  font-size: 1rem; cursor: pointer; letter-spacing: 1px; }
      button:hover { background: #b8925a; }
      .success { display: none; text-align: center; padding: 40px 20px; color: #555; }
      .success h2 { color: #c9a96e; margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>DEMO ESTETIKA</h1>
      <p>Grožio ir estetikos klinika</p>
    </div>

    <div class="form-section" id="formDiv">
      <h2>Užsiregistruokite konsultacijai</h2>
      <p>Užpildykite formą ir susisieksime per 60 sekundžių.</p>
      <form id="leadForm">
        <label>Vardas</label>
        <input type="text" id="vardas" placeholder="Jūsų vardas" required>
        <label>Telefono numeris</label>
        <input type="tel" id="telefonas" placeholder="+370..." required>
        <label>Paslauga</label>
        <select id="paslauga">
          <option>Botox</option>
          <option>Lip filleriai</option>
          <option>Skruostų filleriai</option>
          <option>Lazerinė epiliacija</option>
          <option>Veido valymas</option>
        </select>
        <button type="submit">Gauti konsultaciją</button>
      </form>
    </div>

    <div class="success" id="successDiv">
      <h2>Ačiū!</h2>
      <p>Gavome jūsų užklausą. Susisieksime labai greitai.</p>
    </div>

    <script>
      document.getElementById('leadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var vardas = document.getElementById('vardas').value;
        var telefonas = document.getElementById('telefonas').value.replace('+', '');
        var paslauga = document.getElementById('paslauga').value;

        var url = 'https://hook.eu1.make.com/peymmlbabv9mbxrfkuqc19n5bs27uw0k?vardas=' + encodeURIComponent(vardas) +
  '&telefonas=' + encodeURIComponent(telefonas) + '&paslauga=' + encodeURIComponent(paslauga);
        fetch(url);

        document.getElementById('formDiv').style.display = 'none';
        document.getElementById('successDiv').style.display = 'block';
      });
    </script>
  </body>
  </html>
